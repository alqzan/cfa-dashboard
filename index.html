<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CFA v7">
<meta name="format-detection" content="telephone=no">
<title>Simple CFA Study Tracker v7.9</title>
<meta name="author" content="Othman Abdullah">
<meta name="theme-color" content="#0E1621">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1621'/%3E%3Cpath d='M6 22h4v4H6zM13 16h4v10h-4zM20 9h4v17h-4z' fill='%23C7A258'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css?v=7.9.0">
</head>
<body>
<div class="wrap">

  <header>
  <h1>Simple CFA Study Tracker <span>v7.9</span></h1>
    <div class="exam-row">
      <label class="exam-lab">تاريخ الاختبار
        <input type="date" id="examDateIn">
      </label>
      <div class="exam-days"><b class="mono" id="examDaysVal">—</b><span>يوماً متبقياً</span></div>
    </div>
  </header>

  <section class="summary">
    <div class="sum-grid">
      <div class="sum-card">
        <div class="sum-v mono"><span id="progressPctVal">0</span><small>%</small></div>
        <div class="sum-k">نسبة التقدم العامة</div>
      </div>
      <div class="sum-card">
        <div class="sum-v mono"><span id="readingsDoneVal">0</span><small>/<span id="readingsTotalVal">0</span></small></div>
        <div class="sum-k">قراءات مكتملة</div>
      </div>
    </div>
    <div class="bar"><i id="progressBar" style="width:0%"></i></div>
  </section>

  <section class="sec readings-sec">
    <div class="sec-head">
      <h2>القراءات</h2>
      <input type="search" id="searchIn" placeholder="ابحث في القراءات…" aria-label="بحث">
    </div>
    <div class="topics-nav" id="topicsNav"></div>
    <div class="readings-toolbar">
      <button type="button" id="expandAllBtn">توسيع الكل</button>
      <button type="button" id="collapseAllBtn">طي الكل</button>
    </div>
    <div id="readingsHost"></div>
  </section>

  <section class="sec mock-sec">
    <h2>الاختبارات التجريبية</h2>
    <div class="mock-form">
      <input type="date" id="mkDate" value="">
      <input type="text" id="mkName" placeholder="اسم الاختبار">
      <input type="number" id="mkScore" min="0" max="100" step="0.5" placeholder="النتيجة %">
      <input type="text" id="mkNote" placeholder="ملاحظة (اختياري)">
      <button id="mockAddBtn">حفظ</button>
    </div>
    <div id="mockList"></div>
  </section>

  <div class="tools">
    <button class="grow" id="exportBtn">تصدير نسخة احتياطية</button>
    <button id="importBtn">استيراد نسخة احتياطية</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>

  <div class="ver-row"><span class="ver-tag">v7.9.0</span></div>

</div>
<div id="savedPill">✓ حُفظ</div>

<script src="assets/js/app.js?v=7.9.0" defer></script>
</body>
</html>
