name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate static assets exist
        run: |
          test -f index.html
          test -f assets/css/app.css
          test -f assets/js/app.js
          test -f assets/js/sync.js
          test -f sw.js
          echo "Core files present."

      - name: Run tests
        run: npm test

      - name: Prepare Pages site (static, no build step)
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js icon-192.png icon-512.png apple-touch-icon.png _site/
          cp -r assets _site/assets
          # firebase-config.js is intentionally gitignored and must never be published from CI
          rm -f _site/assets/js/firebase-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
